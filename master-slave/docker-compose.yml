version: '3.8'

networks:
  ms-network:
    driver: bridge

services:
  master:
    image: mysql:8.0
    container_name: ms-master
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: demo_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: apppass
    volumes:
      - ./master/my.cnf:/etc/mysql/conf.d/replication.cnf:ro
      - ./master/init:/docker-entrypoint-initdb.d:ro
      - ms-master-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - ms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  slave:
    image: mysql:8.0
    container_name: ms-slave
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ./slave/my.cnf:/etc/mysql/conf.d/replication.cnf:ro
      - ms-slave-data:/var/lib/mysql
    ports:
      - "3307:3306"
    depends_on:
      master:
        condition: service_healthy
    networks:
      - ms-network

volumes:
  ms-master-data:
  ms-slave-data:
