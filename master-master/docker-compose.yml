version: '3.8'

networks:
  mm-network:
    driver: bridge

services:
  node1:
    image: mysql:8.0
    container_name: mm-node1
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: demo_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: apppass
    volumes:
      - ./node1/my.cnf:/etc/mysql/conf.d/replication.cnf:ro
      - ./node1/init:/docker-entrypoint-initdb.d:ro
      - mm-node1-data:/var/lib/mysql
    ports:
      - "3310:3306"
    networks:
      - mm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  node2:
    image: mysql:8.0
    container_name: mm-node2
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: demo_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: apppass
    volumes:
      - ./node2/my.cnf:/etc/mysql/conf.d/replication.cnf:ro
      - ./node2/init:/docker-entrypoint-initdb.d:ro
      - mm-node2-data:/var/lib/mysql
    ports:
      - "3311:3306"
    depends_on:
      node1:
        condition: service_healthy
    networks:
      - mm-network

volumes:
  mm-node1-data:
  mm-node2-data:
